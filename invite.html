<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>州之行邀请函</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f8e8ee;
    padding: 0;
  }

  .invite-wrapper {
    width: 420px;
    position: relative;
  }

  .invite-card {
    width: 420px;
    /* aspect ratio = 1280/1811 = 0.7068, height = 420 / 0.7068 = 594.2 */
    height: 594px;
    background: url('invite_bg.jpg') center center / 100% 100% no-repeat;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
  }

  .content-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to bottom,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.85) 8%,
      rgba(255, 255, 255, 0.95) 20%,
      rgba(255, 255, 255, 0.97) 100%);
    padding: 40px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .invite-title {
    font-size: 22px;
    font-weight: 700;
    color: #E91E63;
    margin-bottom: 4px;
  }

  .invite-subtitle {
    font-size: 13px;
    color: #666;
    margin-bottom: 14px;
  }

  .trip-info {
    background: linear-gradient(135deg, rgba(255,249,196,0.7), rgba(248,187,208,0.7));
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 340px;
  }

  .trip-info h3 {
    font-size: 14px;
    color: #C2185B;
    margin-bottom: 8px;
    text-align: center;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 13px;
    color: #333;
  }

  .info-label { color: #666; }
  .info-value { font-weight: 600; color: #1a2744; }

  .people-list {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
  }

  .person {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
  }

  .person.fan { background: linear-gradient(135deg, #42A5F5, #1E88E5); }
  .person.xu { background: linear-gradient(135deg, #AB47BC, #8E24AA); }
  .person.min { background: linear-gradient(135deg, #66BB6A, #43A047); }
  .person.yan { background: linear-gradient(135deg, #26C6DA, #00ACC1); }
  .person.ya { background: linear-gradient(135deg, #FF7043, #E64A19); }

  .bottom-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    width: 100%;
    max-width: 340px;
  }

  .qr-code {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    flex-shrink: 0;
  }

  .link-cta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .link-box {
    background: #f5f5f5;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 10px;
    color: #1565C0;
    word-break: break-all;
  }

  .cta-button {
    display: inline-block;
    background: linear-gradient(135deg, #E91E63, #C2185B);
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
    text-align: center;
  }

  .footer-note {
    margin-top: 8px;
    font-size: 10px;
    color: #999;
    text-align: center;
  }
</style>
</head>
